# A container (v5.1) package: the whole platform ships as an OCI image, so a consumer
# needs only Docker and a TT card. This one file is the entire authoring interface —
# `tt-model package --container examples/container-example.yaml`.

# The format version of this file. It is the same number the published manifest carries
# as "schema_version", so there is one version to reason about, not two.
schema: "5.1"

repo: you/my-model              # the HF repo `push` publishes to
name: my-model
# A POINTER: downloaded to the HOST HF cache at pull time, never baked into the image.
# A bare id follows the repo's default branch, so a consumer may get different weights
# from the ones you validated — pin a revision to prevent that:
#   weights: {repo: org/Weights-7B, revision: <sha>, ignore_patterns: ["*.pt"]}
weights: org/Weights-7B
# The serving stack inside the image:
#   vllm-plugin  stock vLLM from PyPI + the standalone tenstorrent/vllm-tt-plugin.
#                Upstream vLLM's platform-plugin API means a hardware backend no longer
#                needs a fork; this is where Tenstorrent is heading.
#   vllm-fork    the tenstorrent/vllm fork, plugin in-tree, both installed editable.
#                The older arrangement, and what `tt-model install` provisions on a host.
#   tt-dit-server  a diffusion model behind its own HTTP app, served with uvicorn. There
#                are no tokens, no KV cache and no continuous batching in a diffusion
#                pipeline, so no vLLM: point runtime.app at the ASGI target that
#                tt-metal ships beside the model, e.g.
#                  kind: tt-dit-server
#                  runtime: {app: "models.tt_dit.server.flux2.app:app"}
#                and drop max_num_seqs / block_size from serve: — this kind has no
#                engine for them to configure. Its runtime also takes an optional
#                `packages` list (the HTTP stack, defaulting to fastapi/uvicorn/
#                pydantic/pillow) and the same `lock` as the vLLM kinds.
#                These servers read the resolved mesh SHAPE ("2x2") from an environment
#                variable they each name themselves. `mesh_shape_env` says which one;
#                it defaults to FLUX2_MESH_SHAPE, the model this kind was built for, so
#                any OTHER diffusion model should set it:
#                  runtime: {app: "...", mesh_shape_env: OTHER_MESH_SHAPE}
#                The VALUE is always derived from mesh_device below — never hand-write
#                the shape in serve.env, or the two drift.
kind: vllm-plugin
arch: blackhole                 # fixed by the build; every profile shares it

image:
  registry: hf                  # default: OCI blobs ride inside the HF repo under image/.
  # repository: my-model        # only for a real registry: the name under it. Defaults
                                # to `name` above.
                                # Set to e.g. ghcr.io/tenstorrent to publish the image to a
                                # real registry instead — the repo then carries a pointer and
                                # plain `docker pull` works for people without tt-model.

source:
  tt_metal: /path/to/your/tt-metal   # or {repo: ..., ref: ...} to clone in CI
  code:                              # EXACTLY what ships. An allowlist, never a denylist.
    - models/common                  # the readiness runner lives here
    - models/autoports/my_model      # must COVER runtime.extra_models_dir below, or the
                                     # plugin scans a dir that never entered the image
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # vLLM itself — a DIFFERENT package from the plugin below. The plugin monkeypatches
  # vLLM internals, so whichever form you choose is load-bearing, not cosmetic.
  #   {version}  a released vLLM, built from sdist in the image with
  #              VLLM_TARGET_DEVICE=empty (the published wheel is the CUDA build)
  #   {wheel}    the empty-target wheel YOU built — fastest, and exactly the binary you
  #              validated against. This is what v5 shipped via --vllm-wheel.
  #   {path}     a local vLLM source tree, built in the image
  vllm: {version: "0.24.0"}
  # vllm: {wheel: /path/to/dist/vllm-*.whl}
  # vllm: {path: /path/to/vllm}

  # THE DEFAULT: your own checkout, staged into the image the same way source.tt_metal
  # is. Uncommitted work ships, nothing is fetched, and what you serve is what you
  # validated. This is the normal case — community developers work on local branches
  # and forks, and the image carries the tree, so nothing has to resolve anywhere.
  plugin: {path: /path/to/vllm-tt-plugin}

  # Alternatives, when a local checkout is not the right input:
  #   plugin: {repo: https://github.com/tenstorrent/vllm-tt-plugin, ref: <sha>}
  #       cloned during the build — for CI, or to pin a sha someone else can fetch.
  #       The ref must be PUSHED or the build cannot get it.
  #   plugin: {version: "0.1.0"}
  #       a PyPI release that already registers this model.

  # The directory the plugin SCANS for per-model vllm_metadata.json files (it looks at
  # the CHILDREN of this dir). Layouts differ between models, so state it outright.
  # Must be covered by source.code above.
  extra_models_dir: models/autoports/my_model/vllm_bundle

  # extension: models/autoports/my_model/vllm_ext  # optional: a pip-installable ext
  lock: requirements.lock                           # optional but strongly recommended

  # Extra local wheels installed alongside the engine, last, so they win over anything
  # resolved above. (v5 called this --extra-wheel.)
  # wheels:
  #   - /path/to/my-private-lib-1.0-py3-none-any.whl

  # Extra pip resolution overrides, on top of the numpy<2 / opencv pair tt-model always
  # applies. Only needed when a dependency conflict is specific to your model.
  # overrides: ["some-package<2"]

serve:                          # defaults every profile inherits
  port: 8000                    # what the image binds under bare `docker run`; `tt-model serve`
                                # picks the host port itself (20000, walking past busy ones)
  block_size: 64                # required — the TT backend rejects vLLM's default

  # Tool calling and reasoning. Declare the parser NAMES here and tt-model renders the
  # flags correctly.
  capabilities:
    tool_parser: hermes         # e.g. hermes | llama3_json | mistral | qwen3_coder
    reasoning_parser: deepseek_r1

  # Structured launcher config, rendered into --additional-config as JSON. The `tt` block
  # is the Tenstorrent backend's own settings.
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 50331648
      fabric_config: FABRIC_1D_RING

  # Environment for the server process, on top of what the image bakes in. MESH_DEVICE is
  # NOT listed here — it is derived from mesh_device above.
  env:
    ARCH_NAME: blackhole
    TT_METAL_OPERATION_TIMEOUT_SECONDS: "120.0"

  # kind: vllm-fork only — the readiness runner's --server-timeout.
  # server_timeout: 900

  # Anything else you would type after `vllm serve`. Prefer a named field above when one
  # exists; these are passed through verbatim and cannot be validated.
  args: [--trust-remote-code]

# OPTIONAL. Omit this whole block for a single-configuration model — a flat `serve:` block
# above is then the entire launch config (the v4/v5 idiom, where the repo name carries the
# target, e.g. you/my-model-blackholex4). Declare profiles only when ONE image should serve
# SEVERAL configs: different device targets, or different deployment shapes on the same
# hardware — e.g. max_num_seqs 1 for one interactive user at full speed vs 32 for a fleet.
serve_profiles:                 # ONE image serves ALL of these; pick at `serve` time
  - name: p150x2
    description: One interactive user at full speed.   # shown by `tt-model profiles`
    hardware: p150x2
    mesh_device: P150x2         # the plugin's closed enum, validated at load
    max_num_seqs: 8
    max_model_len: 65536
  - name: p150x4
    hardware: p150x4
    mesh_device: P150x4
    max_num_seqs: 32
    max_model_len: 131072
default_profile: p150x4

# ---------------------------------------------------------------------------------
# kind: vllm-fork — the OLDER arrangement: the tenstorrent/vllm fork with the plugin
# in-tree, both installed editable, launched through tt-metal's readiness runner. Use it
# for a model whose serving recipe is that runner. Its runtime block looks like:
#
#   kind: vllm-fork
#   runtime:
#     vllm: {repo: https://github.com/tenstorrent/vllm, ref: <sha>}   # plugin is in-tree
#     model_dir: models/autoports/my_model   # the runner launches by --model-dir;
#                                            # must be covered by source.code
#     lock: requirements.lock
# ---------------------------------------------------------------------------------

verify:                         # build-time assertions run INSIDE the finished image
  - "import models.autoports.my_model.tt as m; assert m"

card:
  # One or two sentences on what the model IS and what it is for. Leads the generated
  # model card, right under the title. The tool cannot know this, so state it here --
  # omit it and the card jumps straight from the title to the hardware sentence.
  description: >
    A 7B instruct model for general chat and code, served on Blackhole via vLLM.
  quickstart: |
    ### Use with your client
    Point it at `http://127.0.0.1:20000` once the server is up (or the port `tt-model serve` printed).
