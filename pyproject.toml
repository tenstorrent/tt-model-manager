[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-model"
version = "0.1.0"
description = "Publish and pull self-contained tt-metal model bundles over Hugging Face Hub"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenstorrent" }]
keywords = ["tenstorrent", "tt-metal", "ttnn", "vllm", "huggingface"]
dependencies = [
    "huggingface_hub>=0.23",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "packaging>=21",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tt-model = "tt_kernel.cli:main"
tt-kernel = "tt_kernel.cli:main"  # legacy alias (deprecated)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tt_kernel = ["py.typed", "docker/Dockerfile", "docker/entrypoint.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
