[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-model"
version = "0.2.0"
description = "Package Tenstorrent models as Docker images and publish them on Hugging Face"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenstorrent" }]
keywords = ["tenstorrent", "tt-metal", "ttnn", "vllm", "docker", "huggingface"]
dependencies = [
    "huggingface_hub>=0.34",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tt-model = "tt_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tt_model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
